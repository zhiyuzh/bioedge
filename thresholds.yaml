# =============================================================
# BioEdge Telemetry Alert Thresholds Configuration
# =============================================================
# This YAML configuration defines the operating thresholds for
# automated environmental and thermal alerts.

# Differential Illuminance alert threshold (|Sensor 1 - Sensor 2|) in Lux
# Exceeding this threshold starts the persistence timer for illuminance alert.
illuminance_threshold: 5000.0

# Differential Illuminance persistence duration in seconds
# Delta must continuously exceed illuminance_threshold for more than this duration to trigger illuminance alert.
illuminance_persistence_seconds: 10

# Raspberry Pi SoC Core CPU Temperature threshold in °C
# Exceeding this threshold starts the persistence timer for overheating alert.
temperature_threshold: 60.0

# Raspberry Pi SoC Core CPU Overheat persistence duration in seconds
# Temperature must continuously exceed temperature_threshold for more than this duration to trigger critical overheat alert.
temperature_persistence_seconds: 10



# =============================================================
# Email Alert Dispatch Configuration (Optional)
# =============================================================
# Credentials should be loaded securely from gitignored .env (recommended)
# or configured directly below:

# Brevo REST API (HTTPS Port 443)
# brevo:
#   api_key: "xkeysib-..."
#   sender_email: "alerts@attolab.org"
#   sender_name: "BioEdge Telemetry"
